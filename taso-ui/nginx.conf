server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $taso_core "${TASO_CORE_UPSTREAM}";

  location = /_taso_auth {
    internal;
    proxy_pass $taso_core/auth/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Taso-Gateway "${TASO_GATEWAY_SECRET}";
    proxy_set_header X-Taso-Original-URI $request_uri;
    proxy_set_header X-Taso-Original-Method $request_method;
  }

  location ^~ /api/v1/ {
    auth_request /_taso_auth;
    auth_request_set $taso_user_id $upstream_http_x_taso_user_id;
    auth_request_set $taso_user_email $upstream_http_x_taso_user_email;
    auth_request_set $taso_permission $upstream_http_x_taso_permission;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Taso-Gateway "${TASO_GATEWAY_SECRET}";
    proxy_set_header X-Taso-User-Id $taso_user_id;
    proxy_set_header X-Taso-User-Email $taso_user_email;
    proxy_set_header X-Taso-Permission $taso_permission;
    proxy_pass $taso_core;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Taso-Gateway "${TASO_GATEWAY_SECRET}";
    proxy_pass $taso_core;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ~* ^/assets/.*\.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
