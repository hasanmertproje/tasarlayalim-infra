name: Taso Browser Production Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taso-browser-prod-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Inspect production browser deployment safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          apps="$(api_get applications)"
          uuid="$(jq -r '.[]|select(.name=="taso-browser-prod")|.uuid' <<<"$apps" | head -n1)"
          [[ -n "$uuid" ]] || { echo '::error::taso-browser-prod not found'; exit 1; }
          detail="$(api_get "applications/$uuid")"
          envs="$(api_get "applications/$uuid/envs")"
          deployments="$(api_get "deployments/applications/$uuid?skip=0&take=10")"
          deployment_summary="$(jq -c '[.. | objects | select(has("created_at") and (has("deployment_uuid") or has("uuid")))] | sort_by(.created_at // "") | reverse | .[0] // {}' <<<"$deployments")"
          deployment_uuid="$(jq -r '.deployment_uuid // .uuid // empty' <<<"$deployment_summary")"
          [[ -n "$deployment_uuid" ]] || { echo '::error::Latest browser deployment UUID is unavailable.'; exit 1; }
          deployment_detail="$(api_get "deployments/$deployment_uuid")"
          raw_logs="$(jq -r '.logs // empty' <<<"$deployment_detail")"
          if [[ -z "$raw_logs" ]]; then raw_logs="$(jq -r '.logs // ""' <<<"$deployment_summary")"; fi
          safe_logs="$(printf '%s\n' "$raw_logs" \
            | sed -E \
              -e 's/([Aa]uthorization:[[:space:]]*[Bb]earer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's/((SECRET|TOKEN|PASSWORD|API_KEY)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's/\b[0-9A-Fa-f]{32,}\b/[REDACTED-LONG-HEX]/g' \
            | tail -n 220)"

          {
            echo '## TASO browser production deployment discovery'
            jq -r '"- UUID: \(.uuid // "n/a")\n- status: \(.status // "unknown")\n- branch: \(.git_branch // "n/a")\n- base directory: \(.base_directory // "n/a")\n- dockerfile: \(.dockerfile_location // "n/a")\n- port: \(.ports_exposes // "n/a")\n- public fqdn: \(.fqdn // "none")"' <<<"$detail"
            echo '- healthcheck metadata:'
            jq -r '"  - enabled: \(.health_check_enabled // "n/a")\n  - path: \(.health_check_path // "n/a")\n  - port: \(.health_check_port // "n/a")\n  - method: \(.health_check_method // "n/a")\n  - return_code: \(.health_check_return_code // "n/a")\n  - interval: \(.health_check_interval // "n/a")\n  - timeout: \(.health_check_timeout // "n/a")\n  - retries: \(.health_check_retries // "n/a")\n  - start_period: \(.health_check_start_period // "n/a")"' <<<"$detail"
            echo '- env key presence:'
            jq -r '["PORT","TASO_BROWSER_WORKER_SECRET","TASO_BROWSER_ALLOWED_HOSTS"][] as $k | "  - " + $k + ": " + (any(.[];.key==$k)|tostring)' <<<"$envs"
            jq -r '"- latest deployment UUID: \(.deployment_uuid // .uuid // "n/a")\n- latest deployment status: \(.status // "unknown")\n- latest deployment commit: \(.commit // .git_commit_sha // "n/a")"' <<<"$deployment_detail"
            echo '- exact deployment diagnostic flags:'
            jq -r '"  - restart_only: \(.restart_only // false)\n  - force_rebuild: \(.force_rebuild // false)\n  - deployment_type: \(.deployment_type // "n/a")\n  - created_at: \(.created_at // "n/a")\n  - updated_at: \(.updated_at // "n/a")\n  - finished_at: \(.finished_at // "n/a")"' <<<"$deployment_detail"
            echo '- sanitized deployment logs:'
            echo '```text'
            if [[ -n "$safe_logs" ]]; then printf '%s\n' "$safe_logs"; else echo '[no logs returned]'; fi
            echo '```'
            echo
            echo 'Read-only diagnostic: no Coolify resource was changed; secret-like values were redacted before output.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ -n "$raw_logs" ]] || { echo '::error::Exact browser deployment returned no logs.'; exit 1; }
