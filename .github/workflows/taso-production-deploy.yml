name: Taso Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taso-production-deploy.yml"
      - "scripts/taso-production-deploy.sh"
      - "scripts/taso-production-bootstrap.sh"
      - "scripts/taso-production-secret-compat.sh"
      - "scripts/taso-production-core-clone-compat.sh"
      - "docker/taso-browser/**"
      - "docker/taso-speaker/**"

permissions:
  contents: read

concurrency:
  group: taso-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TASO_PRODUCTION_DOMAIN: taso.tasarlayalim.com
      TASO_SERVER_IPV4: 45.74.243.96
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy isolated Taso production stack
        run: bash scripts/taso-production-core-clone-compat.sh
