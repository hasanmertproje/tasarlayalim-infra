name: Taso Production Deploy

on:
  workflow_dispatch:
    inputs:
      force_heavy_workers:
        description: "Force rebuild/deploy of TASO Speaker and Voice even when their source paths are unchanged"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/taso-production-deploy.yml"
      - "scripts/taso-production-deploy.sh"
      - "scripts/taso-production-bootstrap.sh"
      - "scripts/taso-production-secret-compat.sh"
      - "scripts/taso-production-core-clone-compat.sh"
      - "scripts/taso-production-api-retry-compat.sh"
      - "scripts/taso-production-ui-retry-compat.sh"
      - "docker/taso-search/**"
      - "docker/taso-browser/**"
      - "docker/taso-speaker/**"
      - "docker/taso-voice/**"
      - "taso/**"
      - "taso-ui/**"

permissions:
  contents: read

concurrency:
  group: taso-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production releases require an operator-triggered workflow_dispatch.
    # A push to main may still schedule this workflow but must never deploy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TASO_PRODUCTION_DOMAIN: taso.tasarlayalim.com
      TASO_SERVER_IPV4: 45.74.243.96
      TASO_FORCE_HEAVY_WORKER_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_heavy_workers && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy isolated Taso production stack
        run: bash scripts/taso-production-ui-retry-compat.sh
