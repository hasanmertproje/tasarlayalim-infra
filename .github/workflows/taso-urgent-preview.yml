name: Taso Urgent Preview
on:
  pull_request:
    branches: [main]
    paths:
      - "taso/**"
      - "taso-ui/**"
      - "docker/taso-search/**"
      - "scripts/taso-urgent-preview-deploy.sh"
      - ".github/workflows/taso-urgent-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taso-urgent-preview
  cancel-in-progress: true
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TASO_PREVIEW_DOMAIN: taso-urgent.demo.tasarlayalim.com
      TASO_PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment script
        run: bash -n scripts/taso-urgent-preview-deploy.sh
      - name: Deploy isolated preview and verify real flows
        run: bash scripts/taso-urgent-preview-deploy.sh
