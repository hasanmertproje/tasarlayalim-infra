name: Taso Urgent Preview
on:
  # Stacked PRs are supported; the job condition limits secret access to in-repo TASO branches.
  pull_request:
    paths:
      - "taso/**"
      - "taso-ui/**"
      - "docker/taso-search/**"
      - "scripts/taso-urgent-preview-deploy.sh"
      - ".github/workflows/taso-urgent-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taso-urgent-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  deploy-and-verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.base_ref == 'main' || startsWith(github.base_ref, 'feature/taso-')))
    # Preview domain/apps/storage are shared: serialize access across PRs.
    # Do not cancel another PR's active deployment.
    concurrency:
      group: taso-urgent-preview-shared-resources
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TASO_PREVIEW_DOMAIN: taso-urgent.demo.tasarlayalim.com
      TASO_PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment script
        run: bash -n scripts/taso-urgent-preview-deploy.sh
      - name: Deploy isolated preview and verify real flows
        run: bash scripts/taso-urgent-preview-deploy.sh
