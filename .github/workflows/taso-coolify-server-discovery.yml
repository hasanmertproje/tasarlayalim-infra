name: Taso Coolify Server Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-coolify-server-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      SERVER_UUID: h6e4ws8nwfi6stqjgrrhgaq6
      PROJECT_UUID: q8zrrvgln9f9zy1tz5q2db0w
      ENVIRONMENT_UUID: witrmsidlkntl6vbjgc9zxsl
      TARGET_COMMIT: a38f091bf03ab309e14f8ab8bfd6d78d112aca04
    steps:
      - name: Inspect Coolify server safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          server="$(api_get "servers/$SERVER_UUID")"
          cleanup="$(api_get "servers/$SERVER_UUID/docker-cleanup")"
          resources="$(api_get "servers/$SERVER_UUID/resources")"

          server_name="$(jq -r '.name // "unknown"' <<<"$server")"
          unreachable_count="$(jq -r '.unreachable_count // 0' <<<"$server")"
          high_disk_notice="$(jq -r '.high_disk_usage_notification_sent // false' <<<"$server")"
          unreachable_notice="$(jq -r '.unreachable_notification_sent // false' <<<"$server")"
          settings="$(jq -c '.settings // {}' <<<"$server")"
          concurrent_builds="$(jq -r '.concurrent_builds // "unknown"' <<<"$settings")"
          queue_limit="$(jq -r '.deployment_queue_limit // "unknown"' <<<"$settings")"
          dynamic_timeout="$(jq -r '.dynamic_timeout // "unknown"' <<<"$settings")"
          force_disabled="$(jq -r '.force_disabled // false' <<<"$settings")"
          force_cleanup="$(jq -r '.force_server_cleanup // false' <<<"$settings")"
          server_role="$(jq -r '.server_role // "unknown"' <<<"$settings")"
          is_build_server="$(jq -r '.is_build_server // false' <<<"$settings")"
          is_reachable="$(jq -r '.is_reachable // false' <<<"$settings")"
          is_usable="$(jq -r '.is_usable // false' <<<"$settings")"
          metrics_enabled="$(jq -r '.is_metrics_enabled // false' <<<"$settings")"
          sentinel_enabled="$(jq -r '.is_sentinel_enabled // false' <<<"$settings")"
          docker_version="$(jq -r '.docker_version // "unknown"' <<<"$settings")"
          compose_version="$(jq -r '.compose_version // "unknown"' <<<"$settings")"

          cleanup_frequency="$(jq -r '.docker_cleanup_frequency // "unknown"' <<<"$cleanup")"
          cleanup_threshold="$(jq -r '.docker_cleanup_threshold // "unknown"' <<<"$cleanup")"
          force_docker_cleanup="$(jq -r '.force_docker_cleanup // false' <<<"$cleanup")"
          delete_unused_volumes="$(jq -r '.delete_unused_volumes // false' <<<"$cleanup")"
          delete_unused_networks="$(jq -r '.delete_unused_networks // false' <<<"$cleanup")"
          disable_image_retention="$(jq -r '.disable_application_image_retention // false' <<<"$cleanup")"

          resource_count="$(jq 'length' <<<"$resources")"
          running_count="$(jq '[.[] | select((.status // "") | startswith("running"))] | length' <<<"$resources")"
          unhealthy_count="$(jq '[.[] | select((.status // "") | contains("unhealthy"))] | length' <<<"$resources")"
          failed_count="$(jq '[.[] | select((.status // "") | test("failed|exited|stopped"; "i"))] | length' <<<"$resources")"
          resource_types="$(jq -r '[.[].type // "unknown"] | group_by(.) | map(.[0] + "=" + (length|tostring)) | join(", ")' <<<"$resources")"

          {
            echo '## Coolify build host safe discovery'
            echo "- server name: $server_name"
            echo "- unreachable count: $unreachable_count"
            echo "- unreachable notification sent: $unreachable_notice"
            echo "- high disk usage notification sent: $high_disk_notice"
            echo "- server reachable: $is_reachable"
            echo "- server usable: $is_usable"
            echo "- server role: $server_role"
            echo "- dedicated build server flag: $is_build_server"
            echo "- concurrent builds: $concurrent_builds"
            echo "- deployment queue limit: $queue_limit"
            echo "- dynamic timeout: $dynamic_timeout"
            echo "- force disabled: $force_disabled"
            echo "- force server cleanup: $force_cleanup"
            echo "- metrics enabled: $metrics_enabled"
            echo "- sentinel enabled: $sentinel_enabled"
            echo "- Docker version: $docker_version"
            echo "- Compose version: $compose_version"
            echo "- Docker cleanup frequency: $cleanup_frequency"
            echo "- Docker cleanup threshold: $cleanup_threshold"
            echo "- force Docker cleanup: $force_docker_cleanup"
            echo "- delete unused volumes: $delete_unused_volumes"
            echo "- delete unused networks: $delete_unused_networks"
            echo "- application image retention disabled: $disable_image_retention"
            echo "- deployed resource count: $resource_count"
            echo "- running resource count: $running_count"
            echo "- unhealthy resource count: $unhealthy_count"
            echo "- failed/exited/stopped resource count: $failed_count"
            echo "- resource type counts: ${resource_types:-[none]}"
            echo 'No IP, SSH credential, token, environment value, log-drain credential, or private key was printed.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$is_reachable" == true && "$is_usable" == true ]] || {
            echo '::error::Coolify server is not currently reachable and usable.'
            exit 1
          }

      - name: Build current UI in isolated Coolify probe
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          API_BASE="${COOLIFY_BASE_URL%/}/api/v1"
          probe_uuid=''

          api() {
            local method="$1" path="$2" body="${3:-}" out code
            out="$(mktemp)"
            local args=(--silent --show-error --connect-timeout 15 --max-time 120 --output "$out" --write-out '%{http_code}'
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header 'Accept: application/json')
            if [[ -n "$body" ]]; then
              args+=(--header 'Content-Type: application/json' --data-binary "$body")
            fi
            code="$(curl "${args[@]}" -X "$method" "$API_BASE/$path")"
            if [[ ! "$code" =~ ^2 ]]; then
              echo "::error::Coolify API $method $path failed with HTTP $code." >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          cleanup() {
            if [[ -n "$probe_uuid" ]]; then
              echo 'Removing isolated UI build probe.'
              curl --silent --show-error --fail-with-body \
                --connect-timeout 15 --max-time 120 \
                --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
                --header 'Accept: application/json' \
                -X DELETE \
                "$API_BASE/applications/$probe_uuid?delete_configurations=true&delete_volumes=true&docker_cleanup=false&delete_connected_networks=true" \
                >/dev/null || echo '::warning::Probe cleanup API call failed; manual cleanup may be required.'
            fi
          }
          trap cleanup EXIT

          payload="$(jq -nc \
            --arg project "$PROJECT_UUID" \
            --arg server "$SERVER_UUID" \
            --arg env "$ENVIRONMENT_UUID" \
            --arg commit "$TARGET_COMMIT" \
            '{project_uuid:$project,server_uuid:$server,environment_name:"production",environment_uuid:$env,
              git_repository:"https://github.com/hasanmertproje/tasarlayalim-infra",git_branch:"main",git_commit_sha:$commit,
              build_pack:"dockerfile",name:"taso-ui-build-probe",description:"Temporary isolated TASO UI build probe",
              ports_exposes:"80",base_directory:"/taso-ui",dockerfile_location:"/Dockerfile",
              autogenerate_domain:false,is_auto_deploy_enabled:false,is_preview_deployments_enabled:false,
              instant_deploy:false,health_check_enabled:false,connect_to_docker_network:false,
              disable_build_cache:true,tags:["taso-diagnostic-probe"]}')"

          create="$(api POST applications/public "$payload")"
          probe_uuid="$(jq -r '.uuid // empty' <<<"$create")"
          [[ -n "$probe_uuid" ]] || { echo '::error::Coolify did not return probe application UUID.'; exit 1; }
          echo "Created isolated UI build probe: $probe_uuid"

          started="$(api POST "applications/$probe_uuid/start?force=true&instant_deploy=false")"
          deployment_uuid="$(jq -r '.deployment_uuid // empty' <<<"$started")"
          [[ -n "$deployment_uuid" ]] || { echo '::error::Coolify did not return probe deployment UUID.'; exit 1; }
          echo "Probe deployment UUID: $deployment_uuid"

          final=''
          for attempt in $(seq 1 60); do
            detail="$(api GET "deployments/$deployment_uuid")"
            status="$(jq -r '.status // "unknown"' <<<"$detail")"
            case "$status" in
              finished|failed|cancelled)
                final="$status"
                break
                ;;
            esac
            sleep 5
          done
          [[ -n "$final" ]] || { echo '::error::Probe deployment did not reach a terminal state in time.'; exit 1; }

          runtime_state="$(api GET "applications/$probe_uuid" | jq -r '.status // "unknown"')"
          {
            echo '## TASO UI isolated Coolify build probe'
            echo "- target commit: $TARGET_COMMIT"
            echo "- probe application UUID: $probe_uuid"
            echo "- probe deployment UUID: $deployment_uuid"
            echo "- deployment terminal status: $final"
            echo "- probe runtime state: $runtime_state"
            echo '- domain assigned: false'
            echo '- production application modified: false'
            echo '- secrets/environment copied: false'
            echo '- probe cleanup: automatic on job exit'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$final" != finished ]]; then
            echo '::error::Isolated Coolify UI build probe failed.'
            exit 1
          fi
