name: Taso UI Runtime Env Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-coolify-server-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TARGET_APP_NAME: taso-ui-prod
    steps:
      - name: Inspect production UI env metadata without values
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          apps="$(api_get applications)"
          app_uuid="$(jq -r --arg n "$TARGET_APP_NAME" '[.[] | select(.name==$n)] | if length==1 then .[0].uuid else empty end' <<<"$apps")"
          [[ -n "$app_uuid" ]] || { echo '::error::Unique taso-ui-prod application not found.'; exit 1; }

          envs="$(api_get "applications/$app_uuid/envs")"
          detail="$(api_get "applications/$app_uuid")"

          describe_key() {
            local key="$1" row count
            count="$(jq --arg k "$key" '[.[] | select(.key==$k)] | length' <<<"$envs")"
            echo "- $key count: $count"
            if [[ "$count" -gt 0 ]]; then
              row="$(jq -c --arg k "$key" '[.[] | select(.key==$k)][0]' <<<"$envs")"
              echo "- $key is_runtime: $(jq -r '.is_runtime // "unset"' <<<"$row")"
              echo "- $key is_buildtime: $(jq -r '.is_buildtime // "unset"' <<<"$row")"
              echo "- $key is_preview: $(jq -r '.is_preview // "unset"' <<<"$row")"
              echo "- $key is_literal: $(jq -r '.is_literal // "unset"' <<<"$row")"
              echo "- $key is_shared: $(jq -r '.is_shared // "unset"' <<<"$row")"
              echo "- $key is_shown_once: $(jq -r '.is_shown_once // "unset"' <<<"$row")"
              value_present="$(jq -r 'if ((.value // "")|length)>0 or ((.real_value // "")|length)>0 then "true" else "false" end' <<<"$row")"
              echo "- $key stored value present: $value_present"
            fi
          }

          {
            echo '## TASO UI runtime env metadata'
            echo "- application UUID: $app_uuid"
            echo "- current runtime state: $(jq -r '.status // "unknown"' <<<"$detail")"
            echo "- connect_to_docker_network: $(jq -r '.settings.connect_to_docker_network // false' <<<"$detail")"
            echo "- inject_build_args_to_dockerfile: $(jq -r '.inject_build_args_to_dockerfile // false' <<<"$detail")"
            echo "- use_build_secrets: $(jq -r '.use_build_secrets // false' <<<"$detail")"
            echo "- env key count total: $(jq 'length' <<<"$envs")"
            describe_key TASO_GATEWAY_SECRET
            describe_key TASO_CORE_UPSTREAM
            echo 'No environment value was printed. Only key presence and non-secret metadata flags were inspected.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          gateway_count="$(jq '[.[] | select(.key=="TASO_GATEWAY_SECRET")] | length' <<<"$envs")"
          upstream_count="$(jq '[.[] | select(.key=="TASO_CORE_UPSTREAM")] | length' <<<"$envs")"
          [[ "$gateway_count" -eq 1 && "$upstream_count" -eq 1 ]] || {
            echo '::error::Required TASO UI runtime environment key is missing or duplicated.'
            exit 1
          }
