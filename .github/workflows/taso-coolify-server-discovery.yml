name: Taso Coolify Diagnostic Probe Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-coolify-server-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      SERVER_UUID: h6e4ws8nwfi6stqjgrrhgaq6
      PROBE_NAME: taso-ui-env-probe
    steps:
      - name: Verify dummy env persistence and remove only stale diagnostic probe
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          API_BASE="${COOLIFY_BASE_URL%/}/api/v1"

          request() {
            local method="$1" path="$2" out code
            out="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header 'Accept: application/json' \
              -X "$method" "$API_BASE/$path" || true)"
            REQUEST_CODE="$code"
            REQUEST_FILE="$out"
          }

          request GET applications
          [[ "$REQUEST_CODE" == 200 ]] || { echo "::error::Application listing failed HTTP $REQUEST_CODE"; rm -f "$REQUEST_FILE"; exit 1; }
          apps="$(cat "$REQUEST_FILE")"; rm -f "$REQUEST_FILE"
          matches="$(jq --arg n "$PROBE_NAME" '[.[]|select(.name==$n)]|length' <<<"$apps")"
          echo "diagnostic probe matches before cleanup: $matches"
          [[ "$matches" -le 1 ]] || { echo '::error::More than one exact diagnostic probe exists; refusing cleanup.'; exit 1; }

          value_persistence='not-applicable'
          probe_uuid=''
          if [[ "$matches" -eq 1 ]]; then
            probe_uuid="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].uuid' <<<"$apps")"
            description="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].description // ""' <<<"$apps")"
            [[ "$description" == 'Temporary TASO UI env injection probe' ]] || { echo '::error::Exact-name app is not our diagnostic probe; refusing cleanup.'; exit 1; }

            request GET "applications/$probe_uuid/envs"
            [[ "$REQUEST_CODE" == 200 ]] || { echo "::error::Probe env lookup failed HTTP $REQUEST_CODE"; rm -f "$REQUEST_FILE"; exit 1; }
            envs="$(cat "$REQUEST_FILE")"; rm -f "$REQUEST_FILE"
            gateway_match="$(jq '[.[]|select(.key=="TASO_GATEWAY_SECRET" and (.is_preview//false)==false and ((.value//"")=="diagnostic-nonsecret-gateway" or (.real_value//"")=="diagnostic-nonsecret-gateway"))]|length' <<<"$envs")"
            upstream_match="$(jq '[.[]|select(.key=="TASO_CORE_UPSTREAM" and (.is_preview//false)==false and ((.value//"")=="http://127.0.0.1:65535" or (.real_value//"")=="http://127.0.0.1:65535"))]|length' <<<"$envs")"
            if [[ "$gateway_match" -eq 1 && "$upstream_match" -eq 1 ]]; then value_persistence=true; else value_persistence=false; fi
            echo "dummy diagnostic values readable and exact: $value_persistence"

            request POST "applications/$probe_uuid/stop?docker_cleanup=false"
            echo "probe stop request HTTP: $REQUEST_CODE"
            rm -f "$REQUEST_FILE"
            sleep 2

            request DELETE "applications/$probe_uuid?delete_configurations=true&delete_volumes=true&docker_cleanup=false&delete_connected_networks=true"
            if [[ "$REQUEST_CODE" != 200 && "$REQUEST_CODE" != 404 ]]; then
              echo "::error::Probe delete failed HTTP $REQUEST_CODE"
              rm -f "$REQUEST_FILE"
              exit 1
            fi
            rm -f "$REQUEST_FILE"
          fi

          request GET applications
          [[ "$REQUEST_CODE" == 200 ]] || { echo "::error::Post-cleanup app listing failed HTTP $REQUEST_CODE"; rm -f "$REQUEST_FILE"; exit 1; }
          remaining="$(jq --arg n "$PROBE_NAME" '[.[]|select(.name==$n)]|length' "$REQUEST_FILE")"
          rm -f "$REQUEST_FILE"
          resources="$(curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header 'Accept: application/json' \
            "$API_BASE/servers/$SERVER_UUID/resources")"

          {
            echo '## TASO diagnostic probe cleanup'
            echo "- exact probe matches before cleanup: $matches"
            echo "- dummy diagnostic values readable and exact: $value_persistence"
            echo "- exact probe matches after cleanup: $remaining"
            echo "- server resource count after cleanup: $(jq 'length' <<<"$resources")"
            echo "- unhealthy/exited resources after cleanup: $(jq '[.[]|select((.status//"")|test("unhealthy|exited|failed";"i"))]|length' <<<"$resources")"
            echo 'No production environment value was read or printed.'
            echo 'Only the exact temporary diagnostic probe was eligible for deletion.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$remaining" -eq 0 ]]
