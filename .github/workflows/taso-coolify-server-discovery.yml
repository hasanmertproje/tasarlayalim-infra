name: Taso Runtime Env Shape Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-coolify-server-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Compare env row shapes without values
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          apps="$(api_get applications)"
          app_uuid() { jq -r --arg n "$1" '[.[]|select(.name==$n)]|if length==1 then .[0].uuid else empty end' <<<"$apps"; }

          describe() {
            local app_name="$1" key="$2" uuid envs status
            uuid="$(app_uuid "$app_name")"
            [[ -n "$uuid" ]] || { echo "::error::$app_name not found"; return 1; }
            envs="$(api_get "applications/$uuid/envs")"
            status="$(api_get "applications/$uuid" | jq -r '.status // "unknown"')"
            echo "- $app_name status=$status key=$key count=$(jq --arg k "$key" '[.[]|select(.key==$k)]|length' <<<"$envs")"
            jq -r --arg k "$key" '[.[]|select(.key==$k)]|to_entries[]|"  row="+((.key+1)|tostring)+" uuid="+(.value.uuid//"[none]")+" runtime="+((.value.is_runtime//false)|tostring)+" buildtime="+((.value.is_buildtime//false)|tostring)+" preview="+((.value.is_preview//false)|tostring)+" shared="+((.value.is_shared//false)|tostring)' <<<"$envs"
          }

          {
            echo '## TASO env row shape comparison'
            describe taso-ui-prod TASO_GATEWAY_SECRET
            describe taso-ui-prod TASO_CORE_UPSTREAM
            describe taso-core-prod TASO_GATEWAY_SECRET
            describe taso-browser-prod TASO_BROWSER_WORKER_SECRET
            echo 'No environment value or real_value field was read or printed.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
