name: Taso UI Runtime Env Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-coolify-server-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TARGET_APP_NAME: taso-ui-prod
    steps:
      - name: Inspect duplicate production UI env metadata without values
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          apps="$(api_get applications)"
          app_uuid="$(jq -r --arg n "$TARGET_APP_NAME" '[.[] | select(.name==$n)] | if length==1 then .[0].uuid else empty end' <<<"$apps")"
          [[ -n "$app_uuid" ]] || { echo '::error::Unique taso-ui-prod application not found.'; exit 1; }
          envs="$(api_get "applications/$app_uuid/envs")"

          safe_rows() {
            local key="$1"
            jq -r --arg k "$key" '
              [.[] | select(.key==$k)]
              | to_entries[]
              | "  row=" + ((.key+1)|tostring)
                + " uuid=" + (.value.uuid // "[none]")
                + " created_at=" + (.value.created_at // "[none]")
                + " updated_at=" + (.value.updated_at // "[none]")
                + " runtime=" + ((.value.is_runtime // false)|tostring)
                + " buildtime=" + ((.value.is_buildtime // false)|tostring)
                + " preview=" + ((.value.is_preview // false)|tostring)
                + " shown_once=" + ((.value.is_shown_once // false)|tostring)
                + " shared=" + ((.value.is_shared // false)|tostring)
            ' <<<"$envs"
          }

          gateway_count="$(jq '[.[] | select(.key=="TASO_GATEWAY_SECRET")] | length' <<<"$envs")"
          upstream_count="$(jq '[.[] | select(.key=="TASO_CORE_UPSTREAM")] | length' <<<"$envs")"

          {
            echo '## TASO UI duplicate env metadata'
            echo "- application UUID: $app_uuid"
            echo "- TASO_GATEWAY_SECRET rows: $gateway_count"
            safe_rows TASO_GATEWAY_SECRET
            echo "- TASO_CORE_UPSTREAM rows: $upstream_count"
            safe_rows TASO_CORE_UPSTREAM
            echo 'No environment value or real_value field was read or printed.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$gateway_count" -eq 2 && "$upstream_count" -eq 2 ]] || {
            echo '::error::Duplicate shape changed; refusing to infer.'
            exit 1
          }
