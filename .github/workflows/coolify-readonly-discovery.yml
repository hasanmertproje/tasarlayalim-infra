name: Coolify Read-Only Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coolify-readonly-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Coolify resources (read-only)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN repository secret is missing"
            exit 1
          fi

          api_get() {
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header "Accept: application/json" \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          version="$(api_get version)"
          servers="$(api_get servers)"
          projects="$(api_get projects)"
          applications="$(api_get applications)"
          github_apps="$(api_get github-apps)"
          services="$(api_get services)"
          project_uuid="$(jq -r 'if type=="array" then .[] | select(.name=="Tasarlayalim Infra") | .uuid end' <<< "$projects" | head -n 1)"
          if [ -z "$project_uuid" ]; then
            echo "::error::Tasarlayalim Infra Coolify project not found"
            exit 1
          fi
          environments="$(api_get "projects/$project_uuid/environments")"

          {
            echo "## Coolify resource discovery (read-only)"
            echo "### Coolify version"
            version_safe="$(printf '%s' "$version" | tr -cd '[:alnum:].-' | cut -c1-64)"
            echo "- ${version_safe:-unknown}"
            echo "### Servers"
            jq -r 'if type=="array" then .[] | "- " + (.name // "unnamed") + " — UUID: " + (.uuid // "n/a") + " — " + (.ip // "IP hidden") else "Unexpected response shape" end' <<< "$servers"
            echo "### Projects"
            jq -r 'if type=="array" then .[] | "- " + (.name // "unnamed") + " — UUID: " + (.uuid // "n/a") else "Unexpected response shape" end' <<< "$projects"
            echo "### Applications"
            jq -r 'if type=="array" then .[] | "- " + (.name // "unnamed") + " — UUID: " + (.uuid // "n/a") + " — status: " + (.status // "unknown") + " — branch: " + (.git_branch // "n/a") + " — domain: " + (.fqdn // "none") + " — server id: " + ((.server_id // "n/a")|tostring) + " — environment id: " + ((.environment_id // "n/a")|tostring) + " — port: " + (.ports_exposes // "n/a") + " — predefined network: " + ((.settings.connect_to_docker_network // false)|tostring) else "Unexpected response shape" end' <<< "$applications"
            echo "### Tasarlayalim Infra environments"
            jq -r 'if type=="array" then .[] | "- " + (.name // "unnamed") + " — id: " + ((.id // "n/a")|tostring) + " — UUID: " + (.uuid // "n/a") else "Unexpected response shape" end' <<< "$environments"
            echo "### GitHub App sources (safe metadata only)"
            jq -r 'if type=="array" then .[] | "- id: " + ((.id // "n/a")|tostring) + " — UUID: " + (.uuid // "n/a") + " — name: " + (.name // "unnamed") + " — app id: " + ((.app_id // "n/a")|tostring) + " — private key id: " + ((.private_key_id // "n/a")|tostring) else "Unexpected response shape" end' <<< "$github_apps"
            echo "### Taso application build metadata (safe fields only)"
            while IFS= read -r app_uuid; do
              [ -z "$app_uuid" ] && continue
              detail="$(api_get "applications/$app_uuid")"
              jq -r '"- \(.name // "unnamed") — UUID: \(.uuid // "n/a") — repo: \(.git_repository // "n/a") — branch: \(.git_branch // "n/a") — build pack: \(.build_pack // "n/a") — base dir: \(.base_directory // "n/a") — Dockerfile: \(.dockerfile_location // "n/a") — Compose: \(.docker_compose_location // "n/a") — source id: \((.source_id // "n/a")|tostring) — private key id: \((.private_key_id // "n/a")|tostring) — server id: \((.server_id // "n/a")|tostring) — project id: \((.project_id // "n/a")|tostring) — environment id: \((.environment_id // "n/a")|tostring) — destination id: \((.destination_id // "n/a")|tostring) — connect network: \((.settings.connect_to_docker_network // false)|tostring) — state: \(.status // "unknown")"' <<< "$detail"
            done < <(jq -r 'if type=="array" then .[] | select((.name // "") | startswith("taso-")) | .uuid else empty end' <<< "$applications")
            echo "### Application storage mounts (metadata only)"
            while IFS= read -r app_uuid; do
              [ -z "$app_uuid" ] && continue
              storage="$(api_get "applications/$app_uuid/storages")"
              echo "- Application $app_uuid"
              jq -r '[ ((.persistent_storages // [])[] | "persistent " + (.name // "unnamed") + " → " + (.mount_path // "unknown")), ((.file_storages // [])[] | "file → " + (.mount_path // "unknown")) ] | if length then .[] else "no Coolify storage mounts" end' <<< "$storage" | sed 's/^/  - /'
            done < <(jq -r 'if type=="array" then .[].uuid else empty end' <<< "$applications")
            echo "### Existing services"
            jq -r 'if type=="array" then .[] | "- " + (.name // "unnamed") + " — UUID: " + (.uuid // "n/a") + " — status: " + (.status // "unknown") else "Unexpected response shape" end' <<< "$services"
            echo "Read-only Coolify API checks completed. No resources were created or changed."
          } | tee -a "$GITHUB_STEP_SUMMARY"
