name: TASO NEXT One-Shot Production Release 2026-10-20

on:
  pull_request:
    paths:
      - scripts/taso-production-one-shot-20261020.mjs
      - tests/taso-production-one-shot-20261020.test.mjs
      - .github/workflows/taso-production-one-shot-20261020.yml
  push:
    branches: [main]
    paths:
      - scripts/taso-production-one-shot-20261020.mjs
      - tests/taso-production-one-shot-20261020.test.mjs
      - .github/workflows/taso-production-one-shot-20261020.yml

permissions:
  contents: read
  checks: read

concurrency:
  group: taso-production
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate one-shot release script and production mutation guards
        run: |
          node --check scripts/taso-production-one-shot-20261020.mjs
          node --test tests/taso-production-one-shot-20261020.test.mjs

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'TASO_ONE_SHOT_RELEASE_20261020')
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TASO_ONE_SHOT_BACKUP_WAIVER: 2026-10-20-explicit-operator-waiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require main SHA Core/UI and Browser checks before Coolify mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          ready=false
          for attempt in $(seq 1 90); do
            checks="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"
            ready=true
            for required in validate browser-worker visual-acceptance; do
              row="$(jq -c --arg name "$required" '[.check_runs[] | select(.name==$name)] | sort_by(.started_at // .created_at // "") | last // empty' <<<"$checks")"
              if [[ -z "$row" ]]; then ready=false; continue; fi
              status="$(jq -r '.status // "missing"' <<<"$row")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"$row")"
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "::error::main SHA validation failed: check=$required conclusion=$conclusion"
                exit 1
              fi
              if [[ "$status" != completed || "$conclusion" != success ]]; then ready=false; fi
            done
            if [[ "$ready" == true ]]; then
              echo "main_sha_checks=PASS sha=$sha"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Main SHA Core/UI and Browser checks did not all pass within 15 minutes."
          exit 1
      - name: Deploy only the existing six TASO production services at the exact release SHA
        run: node scripts/taso-production-one-shot-20261020.mjs
