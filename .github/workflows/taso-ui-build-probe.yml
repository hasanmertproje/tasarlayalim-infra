name: Taso UI Runtime Probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-build-probe.yml
      - taso-ui/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TASO UI image without cache
        run: docker build --no-cache -t taso-ui-runtime-probe ./taso-ui

      - name: Run image with required runtime env shape
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() { docker rm -f taso-ui-runtime-probe >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d \
            --name taso-ui-runtime-probe \
            -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://127.0.0.1:9 \
            -e TASO_GATEWAY_SECRET=probe-only-nonsecret \
            taso-ui-runtime-probe >/dev/null
          sleep 4

          running="$(docker inspect -f '{{.State.Running}}' taso-ui-runtime-probe)"
          status="$(docker inspect -f '{{.State.Status}}' taso-ui-runtime-probe)"
          health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' taso-ui-runtime-probe)"
          echo "container running: $running"
          echo "container status: $status"
          echo "container health: $health"

          if [[ "$running" != true ]]; then
            echo 'Container logs (probe uses only non-secret dummy values):'
            docker logs taso-ui-runtime-probe || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4173/health | grep -q '^ok$'
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          for attempt in $(seq 1 8); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' taso-ui-runtime-probe)"
            [[ "$health" == healthy ]] && break
            [[ "$health" == unhealthy ]] && break
            sleep 5
          done
          health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' taso-ui-runtime-probe)"
          echo "final container health: $health"
          [[ "$health" == healthy ]]
