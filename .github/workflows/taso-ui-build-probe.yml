name: Taso UI Coolify Build Probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-build-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      PROJECT_UUID: q8zrrvgln9f9zy1tz5q2db0w
      SERVER_UUID: h6e4ws8nwfi6stqjgrrhgaq6
      ENVIRONMENT_UUID: witrmsidlkntl6vbjgc9zxsl
      TARGET_COMMIT: a38f091bf03ab309e14f8ab8bfd6d78d112aca04
    steps:
      - name: Build current UI in isolated Coolify probe
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          API_BASE="${COOLIFY_BASE_URL%/}/api/v1"
          probe_uuid=''

          api() {
            local method="$1" path="$2" body="${3:-}" out code
            out="$(mktemp)"
            local args=(--silent --show-error --connect-timeout 15 --max-time 120 --output "$out" --write-out '%{http_code}'
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header 'Accept: application/json')
            if [[ -n "$body" ]]; then
              args+=(--header 'Content-Type: application/json' --data-binary "$body")
            fi
            code="$(curl "${args[@]}" -X "$method" "$API_BASE/$path")"
            if [[ ! "$code" =~ ^2 ]]; then
              echo "::error::Coolify API $method $path failed with HTTP $code." >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          cleanup() {
            if [[ -n "$probe_uuid" ]]; then
              echo 'Removing isolated UI build probe.'
              curl --silent --show-error --fail-with-body \
                --connect-timeout 15 --max-time 120 \
                --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
                --header 'Accept: application/json' \
                -X DELETE \
                "$API_BASE/applications/$probe_uuid?delete_configurations=true&delete_volumes=true&docker_cleanup=false&delete_connected_networks=true" \
                >/dev/null || echo '::warning::Probe cleanup API call failed; manual cleanup may be required.'
            fi
          }
          trap cleanup EXIT

          payload="$(jq -nc \
            --arg project "$PROJECT_UUID" \
            --arg server "$SERVER_UUID" \
            --arg env "$ENVIRONMENT_UUID" \
            --arg commit "$TARGET_COMMIT" \
            '{project_uuid:$project,server_uuid:$server,environment_name:"production",environment_uuid:$env,
              git_repository:"https://github.com/hasanmertproje/tasarlayalim-infra",git_branch:"main",git_commit_sha:$commit,
              build_pack:"dockerfile",name:"taso-ui-build-probe",description:"Temporary isolated TASO UI build probe",
              ports_exposes:"80",base_directory:"/taso-ui",dockerfile_location:"/Dockerfile",
              autogenerate_domain:false,is_auto_deploy_enabled:false,is_preview_deployments_enabled:false,
              instant_deploy:false,health_check_enabled:false,connect_to_docker_network:false,
              disable_build_cache:true,tags:["taso-diagnostic-probe"]}')"

          create="$(api POST applications/public "$payload")"
          probe_uuid="$(jq -r '.uuid // empty' <<<"$create")"
          [[ -n "$probe_uuid" ]] || { echo '::error::Coolify did not return probe application UUID.'; exit 1; }
          echo "Created isolated UI build probe: $probe_uuid"

          started="$(api POST "applications/$probe_uuid/start?force=true&instant_deploy=false")"
          deployment_uuid="$(jq -r '.deployment_uuid // empty' <<<"$started")"
          [[ -n "$deployment_uuid" ]] || { echo '::error::Coolify did not return probe deployment UUID.'; exit 1; }
          echo "Probe deployment UUID: $deployment_uuid"

          final=''
          for attempt in $(seq 1 60); do
            detail="$(api GET "deployments/$deployment_uuid")"
            status="$(jq -r '.status // "unknown"' <<<"$detail")"
            case "$status" in
              finished|failed|cancelled)
                final="$status"
                break
                ;;
            esac
            sleep 5
          done
          [[ -n "$final" ]] || { echo '::error::Probe deployment did not reach a terminal state in time.'; exit 1; }

          runtime_state="$(api GET "applications/$probe_uuid" | jq -r '.status // "unknown"')"
          {
            echo '## TASO UI isolated Coolify build probe'
            echo "- target commit: $TARGET_COMMIT"
            echo "- probe application UUID: $probe_uuid"
            echo "- probe deployment UUID: $deployment_uuid"
            echo "- deployment terminal status: $final"
            echo "- probe runtime state: $runtime_state"
            echo '- domain assigned: false'
            echo '- production application modified: false'
            echo '- secrets/environment copied: false'
            echo '- probe cleanup: automatic on job exit'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$final" != finished ]]; then
            echo '::error::Isolated Coolify UI build probe failed.'
            exit 1
          fi
