name: Taso Search Production Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taso-search-prod-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Inspect production search runtime safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }
          apps="$(api_get applications)"
          uuid="$(jq -r '.[]|select(.name=="taso-search-prod")|.uuid' <<<"$apps" | head -n1)"
          [[ -n "$uuid" ]] || { echo '::error::taso-search-prod not found'; exit 1; }
          detail="$(api_get "applications/$uuid")"
          envs="$(api_get "applications/$uuid/envs")"
          raw_logs="$(api_get "applications/$uuid/logs?lines=120&show_timestamps=true" | jq -r '.logs // ""')"
          safe_logs="$(printf '%s\n' "$raw_logs" \
            | sed -E \
              -e 's/([Aa]uthorization:[[:space:]]*[Bb]earer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's/((SECRET|TOKEN|PASSWORD|API_KEY)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's/\b[0-9A-Fa-f]{32,}\b/[REDACTED-LONG-HEX]/g' \
            | tail -n 120)"
          {
            echo '## TASO search production runtime discovery'
            jq -r '"- UUID: \(.uuid // "n/a")\n- status: \(.status // "unknown")\n- branch: \(.git_branch // "n/a")\n- base directory: \(.base_directory // "n/a")\n- port: \(.ports_exposes // "n/a")\n- public fqdn: \(.fqdn // "none")"' <<<"$detail"
            echo '- env key presence:'
            jq -r '["PORT","SEARXNG_SECRET"][] as $k | "  - " + $k + ": " + (any(.[];.key==$k)|tostring)' <<<"$envs"
            echo '- sanitized last container logs:'
            echo '```text'
            printf '%s\n' "$safe_logs"
            echo '```'
            echo
            echo 'Read-only diagnostic: no Coolify resource was changed; secret-like values were redacted before output.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
