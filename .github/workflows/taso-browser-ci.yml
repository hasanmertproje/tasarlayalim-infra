name: Taso Browser CI

on:
  pull_request:
    branches: [main, feature/taso-next-foundation-20261020, feature/taso-next-studio-m2-20261020, feature/taso-studio-v2-interactions-20261020, feature/taso-studio-html-export-20261020, feature/taso-stacked-ci-coverage-20261020]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser worker
        run: node --check docker/taso-browser/server.mjs
      - name: Test browser worker egress guard
        run: node --test docker/taso-browser/security.test.mjs
      - name: Build browser worker image
        run: docker build -t tasarlayalim-taso-browser ./docker/taso-browser
      - name: Smoke test browser worker runtime health
        run: |
          docker run -d --name taso-browser-ci -p 3100:3100 \
            -e TASO_BROWSER_WORKER_SECRET=ci-browser-secret \
            -e TASO_BROWSER_ALLOWED_HOSTS=example.com \
            tasarlayalim-taso-browser
          # Preserve the container on failure so startup/health logs are available.
          # The app must both serve /health AND pass its declared Docker healthcheck.
          for i in $(seq 1 75); do
            state="$(docker inspect --format '{{.State.Status}}' taso-browser-ci 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' taso-browser-ci 2>/dev/null || true)"
            if [[ "$state" != running ]]; then
              echo "Browser worker container state: ${state:-unavailable}; health: ${health:-unavailable}" >&2
              docker inspect taso-browser-ci --format '{{json .State}}' || true
              docker logs taso-browser-ci 2>&1 | tail -100 || true
              exit 1
            fi
            if [[ "$health" == healthy ]]; then
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(j.ok!==true||j.service!=="taso-browser-worker")process.exit(1)}catch{process.exit(1)}})'
              exit 0
            fi
            sleep 2
          done
          echo "Browser worker did not become healthy within 150 seconds." >&2
          docker inspect taso-browser-ci --format '{{json .State}}' || true
          docker logs taso-browser-ci 2>&1 | tail -100 || true
          exit 1
      - name: Cleanup browser worker runtime
        if: always()
        run: docker rm -f taso-browser-ci 2>/dev/null || true

  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Core and UI images
        run: |
          docker build -t tasarlayalim-taso-core ./taso
          docker build -t tasarlayalim-taso-ui ./taso-ui
      - name: Start isolated acceptance stack
        run: |
          docker network create taso-visual
          docker run -d --rm --name taso-visual-core --network taso-visual --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm --name taso-visual-ui --network taso-visual -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          docker logs taso-visual-core || true
          docker logs taso-visual-ui || true
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture and assert visual acceptance
        run: node scripts/taso-visual-acceptance.mjs
      - name: Reset isolated stack and identity before Studio browser acceptance
        # Earlier visual QA has enrolled the CI owner in TOTP. Studio must test
        # fresh enrollment AND subsequent already-enrolled verification safely.
        run: |
          docker rm -f taso-visual-ui taso-visual-core 2>/dev/null || true
          docker run -d --rm --name taso-visual-core --network taso-visual --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm --name taso-visual-ui --network taso-visual -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null &&
               curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Isolated Studio acceptance stack not ready"
          exit 1
      - name: Accept authenticated TASO Studio editor and capture 320–1920px evidence
        run: node scripts/taso-studio-browser-acceptance.mjs
      - name: Reset isolated stack for project lifecycle acceptance
        run: |
          docker rm -f taso-visual-ui taso-visual-core 2>/dev/null || true
          docker run -d --rm --name taso-visual-core --network taso-visual --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm --name taso-visual-ui --network taso-visual -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          echo "Project lifecycle isolated stack did not become ready." >&2
          docker logs taso-visual-core || true
          docker logs taso-visual-ui || true
          exit 1
      - name: Assert project lifecycle archive trash and restore
        run: node scripts/taso-project-lifecycle-acceptance.mjs
      - name: Reset isolated stack for voice history acceptance
        run: |
          docker rm -f taso-visual-ui taso-visual-core 2>/dev/null || true
          docker run -d --rm --name taso-visual-core --network taso-visual --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm --name taso-visual-ui --network taso-visual -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          echo "Voice-history isolated stack did not become ready." >&2
          docker logs taso-visual-core || true
          docker logs taso-visual-ui || true
          exit 1
      - name: Assert voice history persistence and reopen
        run: node scripts/taso-voice-history-acceptance.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taso-v29-visual-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup
        if: always()
        run: |
          docker rm -f taso-visual-ui taso-visual-core 2>/dev/null || true
          docker network rm taso-visual 2>/dev/null || true
