name: Taso Browser CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser worker
        run: node --check docker/taso-browser/server.mjs
      - name: Test browser worker egress guard
        run: node --test docker/taso-browser/security.test.mjs
      - name: Build browser worker image
        run: docker build -t tasarlayalim-taso-browser ./docker/taso-browser

  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Core and UI images
        run: |
          docker build -t tasarlayalim-taso-core ./taso
          docker build -t tasarlayalim-taso-ui ./taso-ui
      - name: Start isolated acceptance stack
        run: |
          docker network create taso-visual
          docker run -d --rm --name taso-visual-core --network taso-visual --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm --name taso-visual-ui --network taso-visual -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          docker logs taso-visual-core || true
          docker logs taso-visual-ui || true
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Capture and assert visual acceptance
        run: node scripts/taso-visual-acceptance.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taso-v29-visual-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup
        if: always()
        run: |
          docker rm -f taso-visual-ui taso-visual-core 2>/dev/null || true
          docker network rm taso-visual 2>/dev/null || true
