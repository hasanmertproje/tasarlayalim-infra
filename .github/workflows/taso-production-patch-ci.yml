name: Taso Production Patch CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/taso-production-deploy.yml"
      - ".github/workflows/taso-production-patch-ci.yml"
      - "scripts/taso-production-deploy.sh"
      - "scripts/taso-production-bootstrap.sh"
      - "scripts/taso-production-secret-compat.sh"
      - "scripts/taso-production-core-clone-compat.sh"
      - "scripts/taso-production-api-retry-compat.sh"
      - "scripts/taso-production-ui-retry-compat.sh"
      - "tests/taso-production-secret-preservation.test.mjs"
      - "tests/taso-production-s3-preflight.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/taso-production-deploy.yml"
      - ".github/workflows/taso-production-patch-ci.yml"
      - "scripts/taso-production-deploy.sh"
      - "scripts/taso-production-bootstrap.sh"
      - "scripts/taso-production-secret-compat.sh"
      - "scripts/taso-production-core-clone-compat.sh"
      - "scripts/taso-production-api-retry-compat.sh"
      - "scripts/taso-production-ui-retry-compat.sh"
      - "tests/taso-production-secret-preservation.test.mjs"
      - "tests/taso-production-s3-preflight.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate full production compatibility chain
        env:
          TASO_PATCH_VALIDATE_ONLY: "1"
        run: bash scripts/taso-production-ui-retry-compat.sh
      - name: Restore source deploy script after mutation-based patch validation
        run: git checkout -- scripts/taso-production-deploy.sh
      - name: Reject unexpected production secret rotation
        run: node --test tests/taso-production-secret-preservation.test.mjs tests/taso-production-s3-preflight.test.mjs
      - name: Confirm no production token is required
        run: |
          test -z "${COOLIFY_API_TOKEN:-}"
          echo "Validation completed without Coolify credentials or mutations."
