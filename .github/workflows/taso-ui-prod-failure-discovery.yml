name: Taso Coolify Version And Probe State

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-prod-failure-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      PROBE_NAME: taso-ui-env-probe
    steps:
      - name: Read Coolify endpoint health safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          API_BASE="${COOLIFY_BASE_URL%/}/api/v1"

          get_status() {
            local path="$1" out code
            out="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
              --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$API_BASE/$path" || true)"
            printf '%s' "$code" > "$out.code"
            printf '%s' "$out"
          }

          vf="$(get_status version)"
          vcode="$(cat "$vf.code")"
          af="$(get_status applications)"
          acode="$(cat "$af.code")"

          version='[unavailable]'
          if [[ "$vcode" == 200 ]]; then
            version="$(jq -r 'if type=="string" then . else (.version // .coolify_version // "unknown") end' "$vf" 2>/dev/null || echo '[parse-error]')"
          fi

          probe_count='[unavailable]'
          probe_uuid='[unavailable]'
          probe_status='[unavailable]'
          probe_description_match='[unavailable]'
          if [[ "$acode" == 200 ]]; then
            probe_count="$(jq --arg n "$PROBE_NAME" '[.[]|select(.name==$n)]|length' "$af")"
            if [[ "$probe_count" -eq 1 ]]; then
              probe_uuid="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].uuid' "$af")"
              probe_status="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].status // "unknown"' "$af")"
              desc="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].description // ""' "$af")"
              [[ "$desc" == 'Temporary TASO UI env injection probe' ]] && probe_description_match=true || probe_description_match=false
            fi
          fi

          {
            echo '## Coolify endpoint health and diagnostic probe state'
            echo "- GET /version HTTP: $vcode"
            echo "- parsed Coolify version: $version"
            echo "- GET /applications HTTP: $acode"
            echo "- exact taso-ui-env-probe count: $probe_count"
            echo "- probe UUID: $probe_uuid"
            echo "- probe status: $probe_status"
            echo "- probe description matches our diagnostic resource: $probe_description_match"
            echo 'No response body from a failed endpoint was printed.'
            echo 'No secret, environment value, IP, password, private key, or sensitive log was printed.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          rm -f "$vf" "$vf.code" "$af" "$af.code"
          [[ "$acode" == 200 ]] || exit 1
