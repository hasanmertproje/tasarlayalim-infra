name: Taso Coolify Version And Probe State

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-prod-failure-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      PROBE_NAME: taso-ui-env-probe
    steps:
      - name: Read Coolify version and stale probe state safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }

          version_raw="$(api_get version)"
          apps="$(api_get applications)"
          version="$(jq -r 'if type=="string" then . else (.version // .coolify_version // "unknown") end' <<<"$version_raw")"
          probe_count="$(jq --arg n "$PROBE_NAME" '[.[]|select(.name==$n)]|length' <<<"$apps")"
          probe_status='[none]'
          probe_uuid='[none]'
          probe_description_match='not-applicable'
          if [[ "$probe_count" -eq 1 ]]; then
            probe_uuid="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].uuid' <<<"$apps")"
            probe_status="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].status // "unknown"' <<<"$apps")"
            desc="$(jq -r --arg n "$PROBE_NAME" '[.[]|select(.name==$n)][0].description // ""' <<<"$apps")"
            if [[ "$desc" == 'Temporary TASO UI env injection probe' ]]; then probe_description_match=true; else probe_description_match=false; fi
          fi

          {
            echo '## Coolify version and diagnostic probe state'
            echo "- Coolify version: $version"
            echo "- exact taso-ui-env-probe count: $probe_count"
            echo "- probe UUID: $probe_uuid"
            echo "- probe status: $probe_status"
            echo "- probe description matches our diagnostic resource: $probe_description_match"
            echo 'No secret, environment value, IP, password, private key, or sensitive log was read or printed.'
            echo 'Read-only diagnostic. No Coolify resource was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$probe_count" -le 1 ]] || { echo '::error::Multiple exact diagnostic probes found; refusing inference.'; exit 1; }
