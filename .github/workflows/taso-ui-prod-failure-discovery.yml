name: Taso Coolify Control Plane And Public Edge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-prod-failure-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      TASO_PUBLIC_URL: https://taso.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Compare public edge and Coolify control plane safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          API_BASE="${COOLIFY_BASE_URL%/}/api/v1"

          status_public() {
            local url="$1"
            curl --silent --show-error --connect-timeout 5 --max-time 12 \
              --output /dev/null --write-out '%{http_code}' \
              "$url" || true
          }

          status_api() {
            local path="$1"
            curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$API_BASE/$path" || true
          }

          coolify_root="$(status_public "$COOLIFY_BASE_URL")"
          coolify_health="$(status_public "$API_BASE/health")"
          coolify_version="$(status_api version)"
          coolify_apps="$(status_api applications)"
          taso_root="$(status_public "$TASO_PUBLIC_URL")"
          taso_health="$(status_public "$TASO_PUBLIC_URL/health")"
          taso_session="$(status_public "$TASO_PUBLIC_URL/api/auth/session")"

          {
            echo '## Coolify control-plane vs public-edge status matrix'
            echo "- Coolify public root HTTP: $coolify_root"
            echo "- Coolify public /api/v1/health HTTP: $coolify_health"
            echo "- Authenticated /api/v1/version HTTP: $coolify_version"
            echo "- Authenticated /api/v1/applications HTTP: $coolify_apps"
            echo "- TASO public root HTTP: $taso_root"
            echo "- TASO /health HTTP: $taso_health"
            echo "- TASO /api/auth/session HTTP: $taso_session"
            echo 'No endpoint response body was printed.'
            echo 'No secret, environment value, password, private key, cookie, auth payload, or sensitive log was printed.'
            echo 'Read-only diagnostic. No Coolify resource, DNS record, application, auth state, or deployment was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$coolify_health" == 200 && "$coolify_apps" == 200 && "$taso_health" == 200 ]] || exit 1
