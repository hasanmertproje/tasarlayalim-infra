name: Taso Coolify Host And Edge Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-ui-prod-failure-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      TASO_PUBLIC_URL: https://taso.tasarlayalim.com
      TASO_SERVER_IPV4: 45.74.243.96
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Isolate host, proxy, Coolify and TASO reachability safely
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"

          tcp_state() {
            local port="$1"
            if timeout 3 bash -c "</dev/tcp/$TASO_SERVER_IPV4/$port" 2>/dev/null; then
              echo open
            else
              echo closed-or-filtered
            fi
          }

          status_public() {
            local url="$1"
            curl --silent --show-error --connect-timeout 4 --max-time 8 \
              --output /dev/null --write-out '%{http_code}' \
              "$url" || true
          }

          status_forced() {
            local host="$1" path="$2"
            curl --silent --show-error --connect-timeout 4 --max-time 8 \
              --resolve "$host:443:$TASO_SERVER_IPV4" \
              --output /dev/null --write-out '%{http_code}' \
              "https://$host$path" || true
          }

          status_forced_api() {
            local path="$1"
            curl --silent --show-error --connect-timeout 4 --max-time 8 \
              --resolve "coolify.tasarlayalim.com:443:$TASO_SERVER_IPV4" \
              --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "https://coolify.tasarlayalim.com/api/v1/$path" || true
          }

          status_coolify_8000() {
            local path="$1"
            curl --silent --show-error --connect-timeout 4 --max-time 8 \
              --output /dev/null --write-out '%{http_code}' \
              "http://$TASO_SERVER_IPV4:8000$path" || true
          }

          port22="$(tcp_state 22)"
          port80="$(tcp_state 80)"
          port443="$(tcp_state 443)"
          port8000="$(tcp_state 8000)"

          coolify_8000_root="$(status_coolify_8000 /)"
          coolify_8000_health="$(status_coolify_8000 /api/v1/health)"

          public_coolify_health="$(status_public "$COOLIFY_BASE_URL/api/v1/health")"
          public_taso_health="$(status_public "$TASO_PUBLIC_URL/health")"
          public_taso_session="$(status_public "$TASO_PUBLIC_URL/api/auth/session")"

          direct_coolify_root="$(status_forced coolify.tasarlayalim.com /)"
          direct_coolify_health="$(status_forced coolify.tasarlayalim.com /api/v1/health)"
          direct_coolify_version="$(status_forced_api version)"
          direct_coolify_apps="$(status_forced_api applications)"
          direct_taso_root="$(status_forced taso.tasarlayalim.com /)"
          direct_taso_health="$(status_forced taso.tasarlayalim.com /health)"
          direct_taso_session="$(status_forced taso.tasarlayalim.com /api/auth/session)"

          {
            echo '## TASO/Coolify host, proxy and runtime isolation'
            echo "- TCP 22: $port22"
            echo "- TCP 80: $port80"
            echo "- TCP 443: $port443"
            echo "- TCP 8000: $port8000"
            echo "- direct Coolify port 8000 / HTTP: $coolify_8000_root"
            echo "- direct Coolify port 8000 /api/v1/health HTTP: $coolify_8000_health"
            echo "- public Coolify /api/v1/health HTTP: $public_coolify_health"
            echo "- direct-IP/SNI Coolify / HTTP: $direct_coolify_root"
            echo "- direct-IP/SNI Coolify /api/v1/health HTTP: $direct_coolify_health"
            echo "- direct-IP/SNI authenticated Coolify /api/v1/version HTTP: $direct_coolify_version"
            echo "- direct-IP/SNI authenticated Coolify /api/v1/applications HTTP: $direct_coolify_apps"
            echo "- public TASO /health HTTP: $public_taso_health"
            echo "- public TASO /api/auth/session HTTP: $public_taso_session"
            echo "- direct-IP/SNI TASO / HTTP: $direct_taso_root"
            echo "- direct-IP/SNI TASO /health HTTP: $direct_taso_health"
            echo "- direct-IP/SNI TASO /api/auth/session HTTP: $direct_taso_session"
            echo 'Port 8000 probes are unauthenticated HTTP health/status checks only; no credential is sent over plaintext HTTP.'
            echo 'No endpoint response body was printed.'
            echo 'No secret, environment value, password, private key, cookie, auth payload, or sensitive log was printed.'
            echo 'Read-only diagnostic. No service was restarted and no DNS, Coolify resource, application, auth state, or deployment was changed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [[ "$direct_taso_health" == 200 ]] || exit 1
