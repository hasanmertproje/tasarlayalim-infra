# Historical one-shot workflow: release #39185000684 completed successfully on 2026-10-19.
# The temporary no-S3 production mutation job is RETIRED and cannot run again.
# Keep the contract test for auditability; normal production deploy keeps its S3 preflight.
name: TASO One Shot Release Contract (Retired)

on:
  pull_request:
    paths:
      - scripts/taso-production-one-shot-20261019.mjs
      - tests/taso-production-one-shot-20261019.test.mjs
      - .github/workflows/taso-production-one-shot-20261019.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical one-shot release safety contract
        run: |
          node --check scripts/taso-production-one-shot-20261019.mjs
          node --test tests/taso-production-one-shot-20261019.test.mjs
