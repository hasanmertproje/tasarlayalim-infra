name: TASO Public Auth Gate Health (read only)
on:
  pull_request:
    paths:
      - .github/workflows/taso-auth-public-gates.yml
      - scripts/taso-auth-readonly-public-gates.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/taso-auth-readonly-public-gates.mjs
