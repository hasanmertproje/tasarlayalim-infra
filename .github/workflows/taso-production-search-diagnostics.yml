name: Taso Production Search Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taso-production-search-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Read production search runtime status and logs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN repository secret is required}"
          api_get() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header 'Accept: application/json' \
              "$COOLIFY_BASE_URL/api/v1/$1"
          }
          apps="$(api_get applications)"
          uuid="$(jq -r '.[] | select(.name=="taso-search-prod") | .uuid' <<<"$apps" | head -n1)"
          [[ -n "$uuid" ]] || { echo '::error::taso-search-prod application not found.'; exit 1; }
          detail="$(api_get "applications/$uuid")"
          status="$(jq -r '.status // "unknown"' <<<"$detail")"
          echo "taso-search-prod status: $status"
          logs_json="$(api_get "applications/$uuid/logs?lines=120&show_timestamps=true")"
          logs="$(jq -r '.logs // ""' <<<"$logs_json")"
          [[ -n "$logs" ]] || { echo '::warning::Coolify returned no application logs.'; exit 0; }
          printf '%s\n' "$logs" \
            | sed -E \
              -e 's/([Aa]uthorization:[[:space:]]*[Bb]earer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's/((SECRET|TOKEN|PASSWORD|API_KEY)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            | tail -n 120
