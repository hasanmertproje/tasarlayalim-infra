name: Taso Production Route Probe

on:
  workflow_dispatch:
  push:
    branches:
      - fix/taso-production-domain-ownership-20261012
    paths:
      - ".github/workflows/taso-production-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_BASE_URL: https://coolify.tasarlayalim.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      UI_UUID: biuki5ik9ifbphwalsmgukmq
      PROD_DOMAIN: taso.tasarlayalim.com
    steps:
      - name: Inspect safe UI metadata and public auth headers
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$tmp/app.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header 'Accept: application/json' \
            "$COOLIFY_BASE_URL/api/v1/applications/$UI_UUID")"
          [[ "$code" =~ ^2 ]] || { echo "::error::Unable to read production UI metadata (HTTP $code)."; exit 1; }
          jq -r '"UI_METADATA name=\(.name//"") uuid=\(.uuid//"") status=\(.status//"") fqdn=\(.fqdn//"") basic_auth=\(.is_http_basic_auth_enabled//false) connect_network=\(.settings.connect_to_docker_network//"unknown") port=\(.ports_exposes//"") base=\(.base_directory//"") dockerfile=\(.dockerfile_location//"")"' "$tmp/app.json"
          jq -r '"UI_ROUTE_METADATA redirect=\(.redirect//"unknown") health_enabled=\(.health_check_enabled//false) health_path=\(.health_check_path//"") health_port=\(.health_check_port//"") health_method=\(.health_check_method//"") health_return=\(.health_check_return_code//"") custom_healthcheck=\(.custom_healthcheck_found//false)"' "$tmp/app.json"
          jq -r 'keys | map(select(test("auth|middleware|redirect|proxy|traefik|label|domain|fqdn|health";"i"))) | "SAFE_RELEVANT_METADATA_KEYS=" + join(",")' "$tmp/app.json"

          probe() {
            local label="$1"
            local url="$2"
            local headers="$tmp/$label.headers"
            local body="$tmp/$label.body"
            local status
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "PROBE $label status=$status url=$url"
            awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|WWW-Authenticate:|Server:|Location:|Content-Type:|X-Powered-By:|X-Served-By:|X-Request-ID:)/ {gsub(/\r$/,""); print "HEADER " $0}' "$headers" || true
            echo "BODY_SIZE=$(wc -c < "$body" | tr -d ' ')"
          }
          probe root "https://$PROD_DOMAIN/"
          probe health "https://$PROD_DOMAIN/health"
          probe session "https://$PROD_DOMAIN/api/auth/session"
