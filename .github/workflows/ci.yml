name: CI

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'phase4/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          sh -n scripts/healthcheck.sh
          sh -n scripts/notify-ntfy.sh

      - name: Notify CI started
        continue-on-error: true
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITLE: "Taso CI • started"
          MESSAGE: "Project: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: #${{ github.run_number }} | Stage: validation started"
        run: |
          sh ./scripts/notify-ntfy.sh started

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Taso Core dependencies
        run: npm install --prefix taso

      - name: Test Taso Core
        run: npm test --prefix taso

      - name: Build Taso Core container
        run: docker build -t tasarlayalim-taso-core ./taso

      - name: Install Taso UI dependencies
        run: npm install --prefix taso-ui

      - name: Build Taso UI
        run: npm run build --prefix taso-ui

      - name: Build Taso UI container
        run: docker build -t tasarlayalim-taso-ui ./taso-ui

      - name: Start Taso integration stack
        run: |
          docker network create taso-ci
          docker run -d --rm \
            --name taso-core \
            --network taso-ci \
            --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-core
          docker run -d --rm \
            --name tasarlayalim-taso-ui \
            --network taso-ci \
            -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui

      - name: Smoke test Taso UI
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs tasarlayalim-taso-ui || true
          exit 1

      - name: Smoke test Taso Core gateway
        run: |
          curl -fsS http://127.0.0.1:4173/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:4173/api/v1/projects | grep -q '"projects"'

      - name: Verify Core rejects direct unauthenticated API
        run: |
          STATUS=$(docker exec tasarlayalim-taso-ui wget -qO- --server-response http://taso-core:3000/v1/projects 2>&1 | awk '/HTTP\// {code=$2} END {print code}')
          [ "$STATUS" = "401" ]

      - name: Build test image
        run: |
          docker build -t tasarlayalim-infra-test ./docker/test-app

      - name: Start test container
        run: |
          docker run -d --rm --name tasarlayalim-infra-test -p 8080:80 tasarlayalim-infra-test

      - name: Wait for service
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs tasarlayalim-infra-test || true
          exit 1

      - name: Smoke test
        run: |
          sh ./scripts/healthcheck.sh http://127.0.0.1:8080

      - name: Container health
        run: |
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' tasarlayalim-infra-test)
            echo "health=$STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            [ "$STATUS" = "unhealthy" ] && exit 1
            sleep 2
          done
          exit 1

      - name: Build ntfy image
        run: |
          docker build -t tasarlayalim-ntfy ./docker/ntfy

      - name: Notify CI result
        if: always()
        continue-on-error: true
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITLE: "Taso CI • ${{ job.status }}"
          MESSAGE: "Project: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: #${{ github.run_number }} | Result: ${{ job.status }}"
        run: |
          sh ./scripts/notify-ntfy.sh "${{ job.status }}"
