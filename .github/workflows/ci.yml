name: Taso CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taso-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell scripts
        run: |
          sh -n scripts/healthcheck.sh
          sh -n scripts/notify-ntfy.sh
          bash -n scripts/taso-backup.sh
          bash -n scripts/taso-backup-verify.sh
          bash -n scripts/taso-restore.sh

      - name: Smoke test Taso recovery tools
        run: |
          set -eu
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cat > "$WORK/state.json" <<'JSON'
          {
            "projects": [{"id":"project_ci"}],
            "manifests": [],
            "milestones": [],
            "knowledge": [],
            "missions": [{"id":"mission_ci"}],
            "events": [],
            "conversations": []
          }
          TASO_STATE_FILE="$WORK/state.json" \
          TASO_BACKUP_DIR="$WORK/backups" \
          TASO_BACKUP_RETENTION_DAYS=14 \
          bash ./scripts/taso-backup.sh > "$WORK/archive-path"
          ARCHIVE="$(cat "$WORK/archive-path")"
          bash ./scripts/taso-backup-verify.sh "$ARCHIVE" | grep -q 'snapshot=valid'
          TASO_STATE_FILE="$WORK/verify-only-target.json" \
          TASO_BACKUP_DIR="$WORK/backups" \
          bash ./scripts/taso-restore.sh "$ARCHIVE" | grep -q 'mode=verify-only'
          test ! -e "$WORK/verify-only-target.json"
          printf '%s\n' '{"projects":[],"manifests":[],"milestones":[],"knowledge":[],"missions":[],"events":[],"conversations":[]}' > "$WORK/restore-target.json"
          TASO_RESTORE_APPROVED=YES \
          TASO_STATE_FILE="$WORK/restore-target.json" \
          TASO_BACKUP_DIR="$WORK/backups" \
          bash ./scripts/taso-restore.sh --apply "$ARCHIVE" | grep -q 'mode=applied'
          python3 - "$WORK/restore-target.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              state = json.load(handle)
          assert state['projects'][0]['id'] == 'project_ci'
          assert state['missions'][0]['id'] == 'mission_ci'
          PY
          ls "$WORK/backups"/pre-restore-*-taso-state.json.gz >/dev/null
          ls "$WORK/backups"/pre-restore-*-taso-state.json.gz.sha256 >/dev/null

      - name: Validate local voice service
        run: python -m py_compile docker/taso-voice/app.py

      - name: Install Taso Core dependencies
        run: npm install --prefix taso

      - name: Test Taso Core
        run: npm test --prefix taso

      - name: Build Taso Core container
        run: docker build -t tasarlayalim-taso-core ./taso

      - name: Install Taso UI dependencies
        run: npm install --prefix taso-ui

      - name: Build Taso UI
        run: npm run build --prefix taso-ui

      - name: Build Taso UI container
        run: docker build -t tasarlayalim-taso-ui ./taso-ui

      - name: Build Taso local voice container
        run: docker build -t tasarlayalim-taso-voice ./docker/taso-voice

      - name: Start Taso integration stack
        run: |
          docker network create taso-ci
          docker run -d --rm \
            --name taso-core \
            --network taso-ci \
            --network-alias taso-core \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            -e TASO_OWNER_EMAIL=owner@ci.local \
            -e TASO_OWNER_PASSWORD=ci-password \
            -e TASO_AUTH_ALLOW_INSECURE_BOOTSTRAP=1 \
            tasarlayalim-taso-core
          docker run -d --rm \
            --name tasarlayalim-taso-ui \
            --network taso-ci \
            -p 4173:80 \
            -e TASO_CORE_UPSTREAM=http://taso-core:3000 \
            -e TASO_GATEWAY_SECRET=ci-gateway-secret \
            tasarlayalim-taso-ui

      - name: Wait for Taso Core
        run: |
          for i in $(seq 1 30); do
            if docker exec taso-core node -e "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"; then
              echo "Taso Core is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Taso Core did not become ready"
          docker logs taso-core || true
          exit 1

      - name: Smoke test Taso UI
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs tasarlayalim-taso-ui || true
          exit 1

      - name: Smoke test Taso TOTP, trusted device and Core gateway
        run: |
          set -eu
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Taso UI gateway did not become ready"
            docker logs tasarlayalim-taso-ui || true
            docker logs taso-core || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4173/api/auth/session | grep -q '"configured":true'
          curl -fsS http://127.0.0.1:4173/api/auth/session | grep -q '"authenticated":false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/v1/projects)" = "401"

          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR"' EXIT
          LOGIN_JSON="$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"owner@ci.local","password":"ci-password"}' http://127.0.0.1:4173/api/auth/login)"
          printf '%s' "$LOGIN_JSON" | grep -q '"requiresTwoFactorSetup":true'
          CHALLENGE_ID="$(node -e 'console.log(JSON.parse(process.argv[1]).challengeId)' "$LOGIN_JSON")"
          SECRET="$(node -e 'console.log(JSON.parse(process.argv[1]).secret)' "$LOGIN_JSON")"
          CODE="$(python3 - "$SECRET" <<'PY'
          import base64, hashlib, hmac, struct, sys, time
          secret = sys.argv[1]
          padding = '=' * ((8 - len(secret) % 8) % 8)
          key = base64.b32decode(secret + padding)
          counter = int(time.time()) // 30
          digest = hmac.new(key, struct.pack('>Q', counter), hashlib.sha1).digest()
          offset = digest[-1] & 15
          value = ((digest[offset] & 127) << 24) | (digest[offset+1] << 16) | (digest[offset+2] << 8) | digest[offset+3]
          print(f'{value % 1000000:06d}')
          PY
          )"
          ENROLL_PAYLOAD="$(python3 - "$CHALLENGE_ID" "$CODE" <<'PY'
          import json, sys
          print(json.dumps({'challengeId': sys.argv[1], 'code': sys.argv[2], 'deviceName': 'CI trusted device'}))
          PY
          )"
          ENROLL_JSON="$(curl -fsS -c "$COOKIE_JAR" -H 'Content-Type: application/json' -d "$ENROLL_PAYLOAD" http://127.0.0.1:4173/api/auth/2fa/setup/confirm)"
          printf '%s' "$ENROLL_JSON" | grep -q '"authenticated":true'
          printf '%s' "$ENROLL_JSON" | grep -q '"trustedDevice":true'
          printf '%s' "$ENROLL_JSON" | grep -q '"recoveryCodes"'

          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/projects | grep -q '"projects"'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/providers | grep -q '"providers"'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/operations | grep -q '"agents"'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/voice/realtime | grep -q '"fallback":"browser-stt-tts"'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/voice/local | grep -q '"configured":false'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/auth/security | grep -q '"trustedDeviceDays":30'

          curl -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:4173/api/auth/logout | grep -q '"authenticated":false'
          test "$(curl -sS -b "$COOKIE_JAR" -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/v1/projects)" = "401"

          TRUSTED_LOGIN="$(curl -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" -H 'Content-Type: application/json' -d '{"email":"owner@ci.local","password":"ci-password"}' http://127.0.0.1:4173/api/auth/login)"
          printf '%s' "$TRUSTED_LOGIN" | grep -q '"authenticated":true'
          curl -fsS -b "$COOKIE_JAR" http://127.0.0.1:4173/api/v1/projects | grep -q '"projects"'

      - name: Verify Core rejects direct unauthenticated API
        run: |
          docker exec taso-core node -e "fetch('http://127.0.0.1:3000/v1/projects').then((response) => { if (response.status !== 401) { console.error('expected 401, got', response.status); process.exit(1); } console.log('direct unauthenticated Core access rejected with 401'); }).catch((error) => { console.error(error); process.exit(1); })"

      - name: Build infra smoke image
        run: docker build -t tasarlayalim-infra-test ./docker/test-app

      - name: Start infra smoke container
        run: docker run -d --rm --name tasarlayalim-infra-test -p 8080:80 tasarlayalim-infra-test

      - name: Verify infra smoke health
        run: |
          for i in $(seq 1 20); do
            if sh ./scripts/healthcheck.sh http://127.0.0.1:8080; then
              exit 0
            fi
            sleep 1
          done
          docker logs tasarlayalim-infra-test || true
          exit 1

      - name: Build ntfy image
        run: docker build -t tasarlayalim-ntfy ./docker/ntfy

      - name: Notify CI failure
        if: failure() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SOURCE: GitHub
          NTFY_CATEGORY: ci
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NTFY_ACTIONS: view, CI loglarini ac, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}; view, Taso panelini ac, https://taso-v2.demo.tasarlayalim.com/
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="MÜDAHALE GEREKİYOR · PR #${PR_NUMBER}"
            MESSAGE="PR #${PR_NUMBER} doğrulamadan geçemedi. Merge şu anda güvenli değil. Senden beklenen: Hatayı İncele."
          else
            TITLE="MÜDAHALE GEREKİYOR · MAIN"
            MESSAGE="Main doğrulaması başarısız. Yeni sürüm güvenli kabul edilmiyor. Senden beklenen: Hatayı İncele."
          fi
          TITLE="$TITLE" MESSAGE="$MESSAGE" sh ./scripts/notify-ntfy.sh urgent_fix

      - name: Notify PR ready for review
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SOURCE: GitHub
          NTFY_CATEGORY: merge
          PR_URL: ${{ github.event.pull_request.html_url }}
          NTFY_CLICK_URL: ${{ github.event.pull_request.html_url }}
          NTFY_ACTIONS: view, PR incele, ${{ github.event.pull_request.html_url }}; view, Taso Approvals, https://taso-v2.demo.tasarlayalim.com/?screen=Approvals
        run: |
          TITLE="MERGE GEREKİYOR · PR #${{ github.event.pull_request.number }}" \
          MESSAGE="Tüm kontroller başarıyla geçti. Senden beklenen: PR #${{ github.event.pull_request.number }}'yi merge et." \
          sh ./scripts/notify-ntfy.sh merge_ready

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f tasarlayalim-taso-ui taso-core tasarlayalim-infra-test 2>/dev/null || true
          docker network rm taso-ci 2>/dev/null || true
