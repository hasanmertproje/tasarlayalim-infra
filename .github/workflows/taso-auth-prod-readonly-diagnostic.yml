name: TASO Auth Production Diagnostic (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/taso-auth-prod-readonly-diagnostic.yml
      - scripts/taso-auth-prod-readonly-evidence.mjs
      - tests/taso-auth-prod-readonly-evidence.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taso-auth-prod-readonly-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Checkout incident evidence classifier
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe evidence classifier with fixtures
        run: node --test tests/taso-auth-prod-readonly-evidence.test.mjs
      - name: Inspect only production Core metadata and redacted error categories
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          node scripts/taso-auth-prod-readonly-evidence.mjs

